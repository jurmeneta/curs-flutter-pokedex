# Configuració per a `slang` (CLI: `dart run slang`).
#
# Aquest fitxer és la font única de veritat per a slang. El `pubspec.yaml`
# *no* el llegeix slang, i el bloc `slang:` que pugui haver-hi a `pubspec.yaml`
# no té cap efecte.
#
# Quan s'editin els fitxers `lib/exemples/day5/block6_translations/i18n/*.json`
# cal regenerar les traduccions amb:
#
#     dart run slang

base_locale: en
fallback_strategy: base_locale
input_directory: lib/exemples/day5/block6_translations/i18n
flutter_integration: true
# Sense això slang fa imports `deferred` de les locales no-base i un
# `setLocaleSync(AppLocale.ca)` falla amb `_DeferredNotLoadedError`.
# Per a un exemple curt preferim carregar-les totes a memòria.
lazy: false
